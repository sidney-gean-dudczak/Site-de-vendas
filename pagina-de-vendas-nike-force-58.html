<!DOCTYPE html>

</head>

<body>

    <header>

        <a href="pagina-masculina.html" class="cabecalho">🢀</a>

     
        <a href="promocoes.html" class="cabecalho">Promoções</a>

<div class="painel-acessibilidade">

    <button onclick="alterarZoom(1)">A+</button>

    <button onclick="alterarZoom(-1)">A-</button>

    <button onclick="alterarContraste(1)">+ Contraste</button>

    <button onclick="alterarContraste(-1)">- Contraste</button>

    <button onclick="restaurarAcessibilidade()">Restaurar</button>

</div>
    </header>

    <main class="pagina-de-vendas">

        <section class="imagem-ao-lado">

            <div class="imagem-pequena"><img src="imagens/produtos/lancamentos/nike-force/force-modelo-usando.jpg" alt="Nike SB Force 58 modelo usando">
            </div>

            <div class="imagem-pequena"><img src="imagens/produtos/lancamentos/nike-force/nike-force-1.png" alt="Nike SB Force 58 imagem 1">
            </div>

            <div class="imagem-pequena"><img src="imagens/produtos/lancamentos/nike-low/nike-low-2.png" alt="Nike SB Dunk Low Pro imagem 2">

        </section>

        <section class="imagem-principal">
            <img src="imagens/produtos/lancamentos/nike-force/nike-force-3.png" alt="Nike SB Force 58 imagem principal">

            <div class="preco-do-produto">

                <button class="botao-tamanho">39</button>
                <button class="botao-tamanho">40</button>
                <button class="botao-tamanho">41</button>
                <button class="botao-tamanho">42</button>

            <button class="botao-comprar">Comprar</button>
